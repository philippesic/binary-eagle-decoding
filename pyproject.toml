[project]
name = "binary-eagle-decoding"
version = "0.1.0"
description = "W1A1 EAGLE speculative decoding experiment"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "cmake>=3.28,<4",
    "ninja>=1.11,<2",
    "ruff>=0.12,<1",
]
w1a1 = [
    "numpy>=1.26,<3",
    "safetensors>=0.5,<1",
    "torch==2.14.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["third_party", "build", "data", "models", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
